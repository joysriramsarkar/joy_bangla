<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring with Tech Nodes -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Orbital Node Accents -->
  <circle cx="60" cy="6" r="3.5" fill="#f59e0b" />
  <circle cx="114" cy="60" r="3.5" fill="#10b981" />
  <circle cx="60" cy="114" r="3.5" fill="#f59e0b" />
  <circle cx="6" cy="60" r="3.5" fill="#10b981" />

  <!-- Central Cultural Glyphs: Stylized Bengali 'অ' & Open Book -->
  <g transform="translate(60, 66) scale(0.95)">
    <!-- Open Book / Sun Rays base -->
    <path d="M-26,20 C-14,14 -2,17 0,22 C2,17 14,14 26,20 L24,24 C13,19 2,21 0,25 C-2,21 -13,19 -24,24 Z" fill="url(#goldGrad)" />
    
    <!-- Stylized 'অ' Typography -->
    <text x="0" y="4" text-anchor="middle" font-family="'Hind Siliguri', 'Kalpurush', 'SolaimanLipi', sans-serif" font-size="52" font-weight="900" fill="#ffffff" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.6))">অ</text>
  </g>
</svg>
